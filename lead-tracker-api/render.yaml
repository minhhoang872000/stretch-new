# Render Blueprint — https://render.com/docs/blueprint-spec

databases:
  - name: lead-tracker-db
    plan: free
    databaseName: lead_tracker
    user: lead_tracker_user
    region: singapore

services:
  - type: web
    name: lead-tracker-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npx tsx server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: lead-tracker-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "60"
