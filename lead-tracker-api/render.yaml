# Render Blueprint — https://render.com/docs/blueprint-spec
# Database is hosted on Supabase — set DATABASE_URL manually in Render dashboard.

services:
  - type: web
    name: lead-tracker-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npx tsx server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false  # Set manually from Supabase connection string
      - key: DB_SSL
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "60"
