<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stretch.vn Admin</title>
    <!-- Google Fonts preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Primary typefaces -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Material Symbols icon font (display=block: hide ligature text while loading instead of flashing icon names) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
    <!-- Reveal icons only once the icon font is actually ready, so raw icon
         names (filter_alt_off, person_search…) never flash on first paint -->
    <script>
      (function () {
        var reveal = function () { document.documentElement.classList.add('ms-ready'); };
        if (document.fonts && document.fonts.load) {
          document.fonts.load("24px 'Material Symbols Outlined'").then(reveal).catch(reveal);
          // Safety net in case the font request stalls
          setTimeout(reveal, 3000);
        } else {
          reveal();
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
